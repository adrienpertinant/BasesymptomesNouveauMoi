<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base symptômes — Nouveau Moi</title>
<style>
  :root {
    --moss: #3f5b41;
    --moss-dark: #2b4029;
    --leaf: #7a9b6e;
    --bark: #6b5645;
    --cream: #f7f5ef;
    --paper: #ffffff;
    --ink: #2a2e27;
    --ink-soft: #565f52;
    --line: #e2e0d5;
    --accent: #c98a4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Iowan Old Style', 'Georgia', serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    background: var(--moss-dark);
    color: var(--cream);
    padding: 2.2rem 1.5rem 1.6rem;
    text-align: center;
  }
  header h1 {
    font-weight: 500;
    font-size: 1.6rem;
    letter-spacing: 0.02em;
    margin: 0 0 0.3rem;
  }
  header p {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    color: #cfd9c8;
    margin: 0;
  }
  .search-wrap {
    max-width: 640px;
    margin: -1.4rem auto 0;
    padding: 0 1rem;
    position: relative;
    z-index: 5;
  }
  #search {
    width: 100%;
    padding: 0.9rem 1.1rem;
    font-size: 1.05rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 16px rgba(43,64,41,0.15);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    outline: none;
  }
  #search:focus { border-color: var(--leaf); }
  main {
    max-width: 780px;
    margin: 2rem auto 4rem;
    padding: 0 1rem;
  }
  #suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin: 1.1rem 0 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .chip {
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--moss-dark);
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .chip:hover { background: #eef1e9; }
  .browse-block {
    max-width: 780px;
    margin: 1.6rem auto 0;
    padding: 0 1rem;
    text-align: center;
  }
  .browse-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 0.6rem;
  }
  .system-btn {
    background: var(--paper);
    border: 1px solid var(--moss);
    color: var(--moss-dark);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    margin: 0.25rem;
  }
  .system-btn:hover { background: var(--moss); color: var(--cream); }
  .system-btn.active { background: var(--moss-dark); color: var(--cream); border-color: var(--moss-dark); }
  details.programme {
    max-width: 780px;
    margin: 1.6rem auto 0;
    padding: 0 1rem;
  }
  details.programme summary {
    cursor: pointer;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.82rem;
    color: var(--moss-dark);
    font-weight: 600;
    padding: 0.4rem 0;
  }
  .module-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    padding: 0.8rem 0 0.4rem;
  }
  .module-link {
    display: inline-block;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--bark);
    padding: 0.4rem 0.75rem;
    border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    text-decoration: none;
  }
  .module-link:hover { background: #eef1e9; border-color: var(--moss); }
  #empty {
    text-align: center;
    color: var(--ink-soft);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin-top: 3rem;
    font-size: 0.95rem;
  }
  #results-header {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 1.6rem;
  }
  .fiche {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.8rem 1.9rem;
    margin-top: 1.8rem;
  }
  .fiche h2 {
    margin: 0 0 1.2rem;
    font-size: 1.5rem;
    color: var(--moss-dark);
    font-weight: 600;
  }
  .section-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--leaf);
    font-weight: 600;
    margin: 1.6rem 0 0.7rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.35rem;
  }
  .systeme-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 0.9rem;
    padding: 0.6rem 0;
    border-bottom: 1px dashed var(--line);
    align-items: baseline;
  }
  .systeme-row:last-child { border-bottom: none; }
  .systeme-row.highlight .systeme-name { color: var(--accent); }
  .systeme-name {
    font-weight: 600;
    color: var(--bark);
    font-size: 0.92rem;
  }
  .systeme-mecanisme {
    font-size: 0.94rem;
    color: var(--ink);
  }
  .source-tag {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    display: block;
    margin-top: 0.3rem;
  }
  .source-tag a {
    color: #7a8a70;
    text-decoration: none;
    border-bottom: 1px dotted #7a8a70;
    margin-right: 0.5rem;
  }
  .source-tag a:hover { color: var(--moss-dark); border-bottom-color: var(--moss-dark); }
  .decodage {
    background: #f4f0e6;
    border-left: 3px solid var(--accent);
    padding: 0.7rem 1rem;
    margin-bottom: 0.6rem;
    font-style: italic;
    font-size: 0.94rem;
    border-radius: 0 6px 6px 0;
  }
  .remede-cat {
    margin-bottom: 1rem;
  }
  .remede-cat-title {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 600;
    font-size: 0.86rem;
    color: var(--moss);
    margin-bottom: 0.4rem;
  }
  .remede-item {
    font-size: 0.92rem;
    padding: 0.4rem 0 0.4rem 0.9rem;
    border-left: 2px solid #dfe6d8;
    margin-bottom: 0.35rem;
  }
  .remede-item b { color: var(--ink); }
  .no-data {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.85rem;
    color: #a8ada2;
    font-style: italic;
  }
  #load-status {
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink-soft);
    margin-top: 2rem;
  }
  footer {
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
    padding: 1rem;
  }
</style>
</head>
<body>

<header>
  <h1>Base symptômes croisés</h1>
  <p id="header-count">Nouveau Moi · École Synergie Naturopathie</p>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="Cherche un symptôme (ex : fatigue, arthrose, insomnie…)" autofocus disabled>
  <div id="suggestions"></div>
</div>

<div class="browse-block">
  <div class="browse-label">Ou parcours par système :</div>
  <div id="system-buttons"></div>
</div>

<details class="programme">
  <summary>📄 Voir le programme complet (PDF des 20 modules)</summary>
  <div class="module-grid" id="module-grid"></div>
</details>

<main>
  <div id="load-status">Chargement de la base…</div>
  <div id="results-header"></div>
  <div id="empty"></div>
  <div id="results"></div>
</main>

<footer>École Synergie Naturopathie · base enrichie progressivement.</footer>

<script>
const LABELS = {"alimentation": "Alimentation", "hydrologie": "Hydrologie", "respiration": "Respiration", "phytologie_plantes": "Phytologie (plantes)", "bourgeons": "Bourgeons (gemmothérapie)", "huiles_essentielles_et_vegetales": "Huiles essentielles & végétales", "fleurs_de_bach": "Fleurs de Bach", "mineraux_vitamines": "Minéraux & vitamines", "remedes_de_secours": "Remèdes de secours"};
const SYSTEM_CATEGORIES = [{"label": "Digestif", "match": "digestif"}, {"label": "Endocrinien", "match": "endocrinien"}, {"label": "Circulatoire", "match": "circulatoire"}, {"label": "Nerveux", "match": "nerveux"}, {"label": "Immunitaire", "match": "immunitaire"}, {"label": "Ostéo-musculaire", "match": "osteo-musculaire"}, {"label": "Urinaire", "match": "urinaire"}, {"label": "Respiratoire", "match": "respiratoire"}, {"label": "Cutané", "match": "cutane"}, {"label": "Terrain / diathèse", "match": "terrain"}, {"label": "Nutritionnel", "match": "nutritionnel"}];
const MODULE_FILES = {"1": {"file": "Module-1-V5-19-aout-21__1_.pdf", "title": "Introduction & histoire de la naturopathie"}, "2": {"file": "Module-2-V6-26-aout-22-1__1_.pdf", "title": "L'approche naturopathique"}, "3": {"file": "Module-3-V5-1-30-aout__1_.pdf", "title": "Bases scientifiques"}, "4": {"file": "Module-4-V6-8-sept-22.pdf", "title": "Systèmes urinaire et reproducteur"}, "5": {"file": "Module-5-V5-1b-1.pdf", "title": "Eau et hydrologie"}, "6": {"file": "Module-6-V5-31-mars-22-.pdf", "title": "Le système respiratoire"}, "7": {"file": "Module-7-V5-1-26-sept-21.pdf", "title": "Techniques respiratoires (air)"}, "8": {"file": "Module-8-V6-31-aout-22.pdf", "title": "Système nerveux et organes des sens"}, "10": {"file": "Module-10-V5-27-sept-1.pdf", "title": "Le système digestif"}, "11": {"file": "Module-11-V5-1.pdf", "title": "L'hygiène alimentaire"}, "13": {"file": "Module-13-pro.pdf", "title": "Le système endocrinien"}, "14": {"file": "Module-14-pro.pdf", "title": "La phytologie (plantes)"}, "15": {"file": "Module-15-pro.pdf", "title": "Le système ostéo-musculaire"}, "17": {"file": "Module-17-pro.pdf", "title": "Le système circulatoire"}, "18": {"file": "Module-18-pro.pdf", "title": "Les bourgeons"}, "20": {"file": "Module-20-pro.pdf", "title": "Le système immunitaire"}, "21": {"file": "Module-21-pro.pdf", "title": "Fleurs de Bach"}, "23": {"file": "Module-23-pro.pdf", "title": "Les huiles essentielles"}, "25": {"file": "Module-25-pro.pdf", "title": "Remèdes de secours"}, "32": {"file": "Module-32-pro.pdf", "title": "Terrain, maladies de civilisation"}};
const MODULE_ORDER = ["1", "2", "3", "4", "5", "6", "7", "8", "10", "11", "13", "14", "15", "17", "18", "20", "21", "23", "25", "32"];

let DATA = null;

const searchInput = document.getElementById('search');
const resultsEl = document.getElementById('results');
const emptyEl = document.getElementById('empty');
const suggestionsEl = document.getElementById('suggestions');
const systemButtonsEl = document.getElementById('system-buttons');
const resultsHeaderEl = document.getElementById('results-header');
const moduleGridEl = document.getElementById('module-grid');
const loadStatusEl = document.getElementById('load-status');
const headerCountEl = document.getElementById('header-count');

let activeSystem = null;

function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

fetch('symptomes.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(json => {
    DATA = json;
    loadStatusEl.style.display = 'none';
    searchInput.disabled = false;
    headerCountEl.textContent = `Nouveau Moi · École Synergie Naturopathie — v${DATA.meta.version}, ${DATA.meta.nb_symptomes} symptômes`;
    renderSystemButtons();
    renderModuleGrid();
    renderSuggestions('');
  })
  .catch(err => {
    loadStatusEl.textContent = "Impossible de charger la base (symptomes.json introuvable ou invalide). Vérifie que ce fichier est bien dans le même dossier que index.html.";
  });

function renderModuleGrid() {
  moduleGridEl.innerHTML = '';
  MODULE_ORDER.forEach(num => {
    const info = MODULE_FILES[num];
    const a = document.createElement('a');
    a.className = 'module-link';
    a.href = info.file;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = `Module ${num} — ${info.title}`;
    moduleGridEl.appendChild(a);
  });
}

function linkifyModuleSource(sourceStr) {
  const parts = sourceStr.split(',').map(p => p.trim());
  return parts.map(p => {
    const m = p.match(/Module\s+(\d+)/i);
    if (m && MODULE_FILES[m[1]]) {
      return `<a href="${MODULE_FILES[m[1]].file}" target="_blank" rel="noopener">${p}</a>`;
    }
    return p;
  }).join(', ');
}

function renderSystemButtons() {
  systemButtonsEl.innerHTML = '';
  SYSTEM_CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'system-btn' + (activeSystem === cat.match ? ' active' : '');
    btn.textContent = cat.label;
    btn.onclick = () => {
      searchInput.value = '';
      activeSystem = (activeSystem === cat.match) ? null : cat.match;
      renderSystemButtons();
      if (activeSystem) {
        renderBySystem(cat.label, activeSystem);
      } else {
        resultsHeaderEl.innerHTML = '';
        renderResults('');
      }
    };
    systemButtonsEl.appendChild(btn);
  });
}

function renderSuggestions(filterText) {
  suggestionsEl.innerHTML = '';
  if (!DATA) return;
  const list = DATA.symptomes.filter(s => norm(s.symptome).includes(norm(filterText)));
  const toShow = filterText ? list : DATA.symptomes;
  toShow.slice(0, 12).forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = s.symptome;
    chip.onclick = () => {
      activeSystem = null;
      renderSystemButtons();
      searchInput.value = s.symptome;
      renderResults(s.symptome);
    };
    suggestionsEl.appendChild(chip);
  });
}

function fiche(s, highlightMatch) {
  let html = `<div class="fiche"><h2>${s.symptome}</h2>`;

  html += `<div class="section-label">Systèmes impliqués</div>`;
  s.systemes_impliques.forEach(sys => {
    const isHighlighted = highlightMatch && norm(sys.systeme).includes(highlightMatch);
    html += `<div class="systeme-row${isHighlighted ? ' highlight' : ''}">
      <div class="systeme-name">${sys.systeme}</div>
      <div>
        <div class="systeme-mecanisme">${sys.mecanisme}</div>
        <span class="source-tag">${linkifyModuleSource(sys.module_source)}</span>
      </div>
    </div>`;
  });

  if (s.decodage_biologique && s.decodage_biologique.length) {
    html += `<div class="section-label">Décodage biologique</div>`;
    s.decodage_biologique.forEach(d => {
      html += `<div class="decodage">${d.sens}<span class="source-tag">${linkifyModuleSource(d.module_source)}</span></div>`;
    });
  }

  html += `<div class="section-label">Remèdes par catégorie</div>`;
  const remedes = s.remedes;
  let anyRemede = false;
  for (const [key, label] of Object.entries(LABELS)) {
    const items = remedes[key];
    if (items && items.length) {
      anyRemede = true;
      html += `<div class="remede-cat"><div class="remede-cat-title">${label}</div>`;
      items.forEach(item => {
        const parts = Object.entries(item).filter(([k]) => k !== 'module_source');
        html += `<div class="remede-item">${parts.map(([k,v],i) => i===0 ? `<b>${v}</b>` : v).join(' — ')}<span class="source-tag">${linkifyModuleSource(item.module_source)}</span></div>`;
      });
      html += `</div>`;
    }
  }
  if (!anyRemede) {
    html += `<div class="no-data">Aucun remède catégorisé trouvé pour ce symptôme dans les modules actuels.</div>`;
  }
  if (remedes.a_completer) {
    html += `<div class="no-data">À compléter : ${remedes.a_completer}</div>`;
  }

  html += `</div>`;
  return html;
}

function renderBySystem(label, matchKeyword) {
  resultsEl.innerHTML = '';
  emptyEl.innerHTML = '';
  suggestionsEl.innerHTML = '';
  const matches = DATA.symptomes.filter(s =>
    s.systemes_impliques.some(sys => norm(sys.systeme).includes(matchKeyword))
  );
  if (!matches.length) {
    resultsHeaderEl.innerHTML = '';
    emptyEl.innerHTML = `Aucun symptôme rattaché au système « ${label} » pour l'instant.`;
    return;
  }
  resultsHeaderEl.innerHTML = `${matches.length} symptôme${matches.length > 1 ? 's' : ''} lié${matches.length > 1 ? 's' : ''} au système <b>${label}</b>`;
  matches.forEach(s => { resultsEl.innerHTML += fiche(s, matchKeyword); });
}

function renderResults(query) {
  resultsEl.innerHTML = '';
  emptyEl.innerHTML = '';
  resultsHeaderEl.innerHTML = '';
  if (!DATA) return;
  if (!query) { renderSuggestions(''); return; }
  const matches = DATA.symptomes.filter(s => norm(s.symptome).includes(norm(query)));
  renderSuggestions(query);
  if (!matches.length) {
    emptyEl.innerHTML = `Aucun symptôme trouvé pour « ${query} » dans cette base pour l'instant.`;
    return;
  }
  matches.forEach(s => { resultsEl.innerHTML += fiche(s); });
}

searchInput.addEventListener('input', e => {
  activeSystem = null;
  renderSystemButtons();
  renderResults(e.target.value.trim());
});
</script>

</body>
</html>
