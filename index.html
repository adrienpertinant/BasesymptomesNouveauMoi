<style>

    padding: 0 1rem;

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

    background: var(--paper);

    color: var(--moss-dark);
    padding: 0.35rem 0.8rem;
    border-radius: 999px;

  #empty {

    margin-top: 3rem;
    font-size: 0.95rem;
  }

    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.8rem 1.9rem;
    margin-top: 1.8rem;
  }
  .fiche h2 {
    margin: 0 0 1.2rem;
    font-size: 1.5rem;
    color: var(--moss-dark);

  }
  .section-label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.72rem;

    padding-bottom: 0.35rem;

    padding: 0.6rem 0;

  .systeme-name {
    font-weight: 600;
    color: var(--bark);
    font-size: 0.92rem;
  }
  .systeme-mecanisme {
    font-size: 0.94rem;
    color: var(--ink);
  }

    font-size: 0.85rem;
    color: #a8ada2;
    font-style: italic;
  }

    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
    padding: 1rem;

</style>
</head>

 "module_source": "Module 25"}]}}, {"symptome": "Ostéoporose", "systemes_impliques": [{"systeme": "Ostéo-musculaire", "mecanisme": "Destruction de l'architecture osseuse : la minéralisation de la trame est normale, mais la trame est réduite, rendant les os fragiles et les fractures plus fréquentes.", "module_source": "Module 15"}, {"systeme": "Endocrinien", "mecanisme": "Les hormones sexuelles protègeraient les articulations et les os ; leur disparition à la ménopause entraîne une fragilité accrue.", "module_source": "Module 32"}], "decodage_biologique": [{"sens": "Renvoie à l'archétype de la femme, plus précisément l'image de la femme qui procrée — l'ostéoporose traduirait une perte inconsciente (le module coupe la phrase à ce niveau, sens à approfondir).", "module_source": "Module 15"}], "remedes": {"alimentation": [{"conseil": "Minéral : Calcium", "aliments": "Cité pour la consolidation des fractures et l'ostéoporose", "module_source": "Module 25"}], "hydrologie": [{"remede": "Eau de Quinton", "usage": "Cure conseillée pour les personnes atteintes d'ostéoporose", "module_source": "Module 5"}], "respiration": [], "phytologie_plantes": [], "bourgeons": [{"bourgeon": "Bouleau verruqueux", "effet": "Reminéralisant, problèmes articulaires/osseux, ostéoporose", "module_source": "Module 18"}, {"bourgeon": "Airelle rouge", "effet": "Ostéoporose post-ménopause, en synergie avec le pin de montagne", "module_source": "Module 18"}, {"bourgeon": "Pin", "effet": "Indiqué pour l'ostéoporose, en synergie avec ronce et airelle sur une cure de trois mois", "module_source": "Module 18"}], "huiles_essentielles_et_vegetales": [], "fleurs_de_bach": [], "mineraux_vitamines": [], "remedes_de_secours": []}}, {"symptome": "Acné", "systemes_impliques": [{"systeme": "Cutané / hormonal", "mecanisme": "Maladie des follicules pilo-sébacés touchant surtout le visage et le haut du dos, favorisée par une prédisposition héréditaire. À la puberté, l'augmentation des androgènes stimule la production de sébum ; la progestérone explique les poussées prémenstruelles.", "module_source": "Module 8"}, {"systeme": "Digestif", "mecanisme": "L'hyperporosité intestinale peut se manifester par des problèmes de peau incluant l'acné.", "module_source": "Module 11"}], "decodage_biologique": [{"sens": "Mal dans sa peau, manque de confiance en soi : repousser le contact.", "module_source": "Module 8"}], "remedes": {"alimentation": [], "hydrologie": [{"remede": "Eau de Quinton", "usage": "Citée pour les problèmes cutanés dont l'acné", "module_source": "Module 5"}], "respiration": [], "phytologie_plantes": [], "bourgeons": [], "huiles_essentielles_et_vegetales": [{"nom": "Synergie arbre à thé (tea tree) + menthe poivrée + géranium", "usage": "Diluées dans une huile végétale", "module_source": "Module 8"}, {"nom": "Huile de nigelle", "usage": "Anti-inflammatoire : acné, abcès, eczéma, psoriasis", "module_source": "Module 23"}], "fleurs_de_bach": [], "mineraux_vitamines": [{"nom": "Soufre", "effet": "Carence associée à acné, urticaire, allergies", "module_source": "Module 25"}], "remedes_de_secours": []}}, {"symptome": "Insomnie", "systemes_impliques": [{"systeme": "Nerveux", "mecanisme": "Deux types : difficulté à s'endormir (temps d'endormissement > 30 min) ou réveil au milieu de la nuit. Un GABA bas (neurotransmetteur du retour au calme) est associé à l'insomnie, ainsi qu'à l'anxiété et au brouillard mental. Le stress chronique est un facteur aggravant.", "module_source": "Module 8"}], "decodage_biologique": [{"sens": "L'insomnie n'est pas une maladie en soi mais une des « sonnettes d'alarme » d'un déséquilibre dans l'état de santé psychosomatique de la personne, qui doit l'inciter à revoir ses conditions de vie.", "module_source": "Module 8"}], "remedes": {"alimentation": [], "hydrologie": [], "respiration": [], "phytologie_plantes": [], "bourgeons": [], "huiles_essentielles_et_vegetales": [], "fleurs_de_bach": [], "mineraux_vitamines": [], "remedes_de_secours": [], "a_completer": "Modules 18, 23 et 25 mentionnent chacun l'insomnie (3-5 occurrences) mais le détail des remèdes associés n'a pas encore été extrait précisément — à approfondir lors de la prochaine passe."}}]};
const LABELS = {"alimentation": "Alimentation", "hydrologie": "Hydrologie", "respiration": "Respiration", "phytologie_plantes": "Phytologie (plantes)", "bourgeons": "Bourgeons (gemmothérapie)", "huiles_essentielles_et_vegetales": "Huiles essentielles & végétales", "fleurs_de_bach": "Fleurs de Bach", "mineraux_vitamines": "Minéraux & vitamines", "remedes_de_secours": "Remèdes de secours"};

const searchInput = document.getElementById('search');
const resultsEl = document.getElementById('results');
const emptyEl = document.getElementById('empty');
const suggestionsEl = document.getElementById('suggestions');

function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function renderSuggestions(filterText) {
  suggestionsEl.innerHTML = '';
  const list = DATA.symptomes.filter(s => norm(s.symptome).includes(norm(filterText)));
  const toShow = filterText ? list : DATA.symptomes;
  toShow.slice(0, 12).forEach(s => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = s.symptome;
    chip.onclick = () => { searchInput.value = s.symptome; renderResults(s.symptome); };
    suggestionsEl.appendChild(chip);
  });
}

function fiche(s) {
  let html = `<div class="fiche"><h2>${s.symptome}</h2>`;

  html += `<div class="section-label">Systèmes impliqués</div>`;
  s.systemes_impliques.forEach(sys => {
    html += `<div class="systeme-row">
      <div class="systeme-name">${sys.systeme}</div>
      <div>
        <div class="systeme-mecanisme">${sys.mecanisme}</div>
        <span class="source-tag">${sys.module_source}</span>
      </div>
    </div>`;
  });

  if (s.decodage_biologique && s.decodage_biologique.length) {
    html += `<div class="section-label">Décodage biologique</div>`;
    s.decodage_biologique.forEach(d => {
      html += `<div class="decodage">${d.sens}<span class="source-tag">${d.module_source}</span></div>`;
    });
  }

  html += `<div class="section-label">Remèdes par catégorie</div>`;
  const remedes = s.remedes;
  let anyRemede = false;
  for (const [key, label] of Object.entries(LABELS)) {
    const items = remedes[key];
    if (items && items.length) {
      anyRemede = true;
      html += `<div class="remede-cat"><div class="remede-cat-title">${label}</div>`;
      items.forEach(item => {
        const parts = Object.entries(item).filter(([k]) => k !== 'module_source');
        html += `<div class="remede-item">${parts.map(([k,v],i) => i===0 ? `<b>${v}</b>` : v).join(' — ')}<span class="source-tag">${item.module_source}</span></div>`;
      });
      html += `</div>`;
    }
  }
  if (!anyRemede) {
    html += `<div class="no-data">Aucun remède catégorisé trouvé pour ce symptôme dans les modules actuels.</div>`;
  }
  if (remedes.a_completer) {
    html += `<div class="no-data">À compléter : ${remedes.a_completer}</div>`;
  }

  html += `</div>`;
  return html;
}

function renderResults(query) {
  resultsEl.innerHTML = '';
  emptyEl.innerHTML = '';
  if (!query) { renderSuggestions(''); return; }
  const matches = DATA.symptomes.filter(s => norm(s.symptome).includes(norm(query)));
  renderSuggestions(query);
  if (!matches.length) {
    emptyEl.innerHTML = `Aucun symptôme trouvé pour « ${query} » dans cette v1 (11 symptômes seulement pour l'instant).`;
    return;
  }
  matches.forEach(s => { resultsEl.innerHTML += fiche(s); });
}

searchInput.addEventListener('input', e => renderResults(e.target.value.trim()));
renderSuggestions('');
</script>
